name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          # exiftool and ffmpeg so the date-writing and remux tests run
          # rather than skip.
          sudo apt-get install -y libusb-1.0-0 libimage-exiftool-perl ffmpeg
          python -m pip install --upgrade pip
          python -m pip install pyusb pillow
      - name: Run the test suite
        run: python tests/test_digicarlo.py

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PyQt6
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
              libfontconfig1 ffmpeg libimage-exiftool-perl
          python3 -m pip install PyQt6
      - name: The window builds and draws offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tests/test_gui.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the .deb
        run: ./packaging/build-deb.sh
      - name: Verify it unpacks and runs
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil
          dpkg-deb -c packaging/digicarlo_*.deb
          mkdir -p /tmp/root && dpkg-deb -x packaging/digicarlo_*.deb /tmp/root
          export PYTHONPATH=/tmp/root/usr/lib/python3/dist-packages
          /tmp/root/usr/bin/digicarlo --version
          /tmp/root/usr/bin/digicarlo plan --help > /dev/null
          # digicarlo-gui must fail with advice, not a traceback, without PyQt6.
          if /tmp/root/usr/bin/digicarlo-gui 2>&1 | grep -q "needs PyQt6"; then
            echo "digicarlo-gui degrades cleanly without PyQt6"
          else
            echo "digicarlo-gui did not give the expected message" >&2; exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: digicarlo-deb
          path: packaging/digicarlo_*.deb
